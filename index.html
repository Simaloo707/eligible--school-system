<!DOCTYPE html>
<html>
<head>
    <title>Eligible Pre & Primary School</title>
</head>

<body>

    <h1>Eligible Pre & Primary School</h1>
    <h2>Online Admission Application</h2>

    <p>Welcome to our online student admission system.</p>

    <form>
        <label>Student's Full Name:</label><br>
        <input type="text"><br><br>

        <label>Date of Birth:</label><br>
        <input type="date"><br><br>

        <label>Parent/Guardian Name:</label><br>
        <input type="text"><br><br>

        <label>Parent Phone Number:</label><br>
        <input type="tel"><br><br>

        <label>Class Applying For:</label><br>
        <select>
            <option>Pre-Primary</option>
            <option>Standard I</option>
            <option>Standard II</option>
            <option>Standard III</option>
            <option>Standard IV</option>
        </select><br><br>

        <button type="button">Submit Application</button>
    </form>

</body>
</html>
